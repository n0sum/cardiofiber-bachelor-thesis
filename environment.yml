# Minimal environment: only the dependencies imported directly by the Python
# scripts of the repository. Versions of the development environment "cardiofiber".
#
#   conda env create -f environment.yml
#
# pyvista and vtk are pinned exactly: the same simulation read with
# different versions gave a CV differing by 3.5% between two machines.
name: cardiofiber
channels:
  - conda-forge
dependencies:
  - python=3.13.15
  - numpy=2.5.3
  - scipy=1.18.0
  - pandas=3.0.5
  - matplotlib=3.11.1
  - h5py=3.16.0
  - meshio=5.3.5
  - pyvista=0.48.4
  - vtk=9.6.2

