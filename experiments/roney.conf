# Method 2 of Roney et al. 2019 (estimator/roney.py), comparison with the
# per-face estimator on map triplets. All keys are required.

# Geodesic disc around the face centroid, in mm; Roney uses a
# square with 5 mm sides.
patch.radius_mm         = 2.5
# Points of the patch used in the planar fit, chosen at random (all if there are fewer).
patch.n_points          = 20
patch.seed              = 0

# RMS residual of the planar fit divided by |g| * radius. 0.14 is the median residual
# of a 60-degree fold through the center of the patch, with 20 random
# points.
fit.max_residual        = 0.14

# As in the C++ estimator.
mask.min_singular_value = 1e-3
